<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>
</head>
<body style="width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #ffffff; padding: 48pt 44pt; display: flex; flex-direction: column;">

  <p style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 2pt; text-transform: uppercase;">Key Insight</p>
  <h2 style="font-size: 26pt; font-weight: 700; color: #111; margin-top: 8pt; letter-spacing: -0.02em; line-height: 1.3;">유저가 잘해야 하는 게 아니라,<br>시스템이 알아서 해야 한다</h2>

  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 24pt; margin-top: 32pt;">

    <!-- Left: 기존 방식 -->
    <div style="background: #fafafa; border-radius: 10pt; padding: 24pt;">
      <p style="font-size: 11pt; font-weight: 700; color: #bbb; margin-bottom: 16pt;">기존 방식</p>
      <div style="display: flex; flex-direction: column; gap: 12pt;">
        <div style="display: flex; align-items: flex-start; gap: 10pt;">
          <div style="width: 6pt; height: 6pt; background: #ddd; border-radius: 50%; margin-top: 5pt; flex-shrink: 0;"></div>
          <p style="font-size: 12pt; color: #999; line-height: 1.5;"><span style="color: #999;">유저가</span> 프롬프트를 잘 짜야 함</p>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 10pt;">
          <div style="width: 6pt; height: 6pt; background: #ddd; border-radius: 50%; margin-top: 5pt; flex-shrink: 0;"></div>
          <p style="font-size: 12pt; color: #999; line-height: 1.5;"><span style="color: #999;">유저가</span> 결과를 평가해야 함</p>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 10pt;">
          <div style="width: 6pt; height: 6pt; background: #ddd; border-radius: 50%; margin-top: 5pt; flex-shrink: 0;"></div>
          <p style="font-size: 12pt; color: #999; line-height: 1.5;"><span style="color: #999;">유저가</span> 마음에 안 들면 다시 시도</p>
        </div>
      </div>
    </div>

    <!-- Right: ALJALDAKKALSEN -->
    <div style="background: #111; border-radius: 10pt; padding: 24pt;">
      <p style="font-size: 11pt; font-weight: 700; color: #666; margin-bottom: 16pt;">ALJALDAKKALSEN</p>
      <div style="display: flex; flex-direction: column; gap: 12pt;">
        <div style="display: flex; align-items: flex-start; gap: 10pt;">
          <div style="width: 6pt; height: 6pt; background: #fff; border-radius: 50%; margin-top: 5pt; flex-shrink: 0;"></div>
          <p style="font-size: 12pt; color: #fff; line-height: 1.5;"><span style="font-weight: 600;">시스템이</span> 질문을 최적화</p>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 10pt;">
          <div style="width: 6pt; height: 6pt; background: #fff; border-radius: 50%; margin-top: 5pt; flex-shrink: 0;"></div>
          <p style="font-size: 12pt; color: #fff; line-height: 1.5;"><span style="font-weight: 600;">시스템이</span> 여러 방향을 시뮬레이션</p>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 10pt;">
          <div style="width: 6pt; height: 6pt; background: #fff; border-radius: 50%; margin-top: 5pt; flex-shrink: 0;"></div>
          <p style="font-size: 12pt; color: #fff; line-height: 1.5;"><span style="font-weight: 600;">시스템이</span> 최선을 골라서 제시</p>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
