<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>
</head>
<body style="width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #111; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Label -->
  <div style="margin: 32pt 0 0 44pt;">
    <span style="font-size: 9pt; font-weight: 600; color: #666; letter-spacing: 2pt; text-transform: uppercase;">RALPH SETUP</span>
  </div>

  <!-- Title -->
  <div style="margin: 10pt 44pt 0 44pt; font-size: 28pt; font-weight: 700; color: #fff; line-height: 1.3;">이걸 어떻게 만들었나</div>

  <!-- Simple pipeline -->
  <div style="margin: 24pt 44pt 0 44pt; display: flex; align-items: center; gap: 0; flex-wrap: nowrap;">
    <div style="padding: 6pt 12pt; background: #222; border-radius: 5pt; font-size: 9pt; font-weight: 500; color: #888; white-space: nowrap;">할 일 정의</div>
    <div style="font-size: 10pt; color: #444; padding: 0 4pt;">&rarr;</div>
    <div style="padding: 6pt 12pt; background: #222; border-radius: 5pt; font-size: 9pt; font-weight: 500; color: #888; white-space: nowrap;">AI가 조사</div>
    <div style="font-size: 10pt; color: #444; padding: 0 4pt;">&rarr;</div>
    <div style="padding: 6pt 12pt; background: #222; border-radius: 5pt; font-size: 9pt; font-weight: 500; color: #888; white-space: nowrap;">AI가 구현</div>
    <div style="font-size: 10pt; color: #444; padding: 0 4pt;">&rarr;</div>
    <div style="padding: 6pt 12pt; background: #222; border-radius: 5pt; font-size: 9pt; font-weight: 500; color: #888; white-space: nowrap;">AI가 검증</div>
    <div style="font-size: 10pt; color: #444; padding: 0 4pt;">&rarr;</div>
    <div style="padding: 6pt 12pt; background: #fff; border-radius: 5pt; font-size: 9pt; font-weight: 600; color: #111; white-space: nowrap;">완성</div>
  </div>

  <!-- 3-column grid -->
  <div style="flex: 1; margin: 20pt 44pt 0 44pt; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12pt;">

    <div style="background: #1a1a1a; border-radius: 8pt; padding: 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 32pt; font-weight: 800; color: #fff; margin-bottom: 6pt;">18</div>
      <div style="font-size: 11pt; color: #999; line-height: 1.6;">만들어야 할 기능을<br>미리 목록으로 정의</div>
    </div>

    <div style="background: #1a1a1a; border-radius: 8pt; padding: 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 18pt; font-weight: 700; color: #fff; margin-bottom: 6pt;">자율 실행</div>
      <div style="font-size: 11pt; color: #999; line-height: 1.6;">AI가 목록을 보고<br>하나씩 알아서 만들어감</div>
    </div>

    <div style="background: #1a1a1a; border-radius: 8pt; padding: 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 18pt; font-weight: 700; color: #fff; margin-bottom: 6pt;">자동 학습</div>
      <div style="font-size: 11pt; color: #999; line-height: 1.6;">앞에서 배운 걸<br>다음 작업에 재활용</div>
    </div>

  </div>

  <!-- Footer -->
  <div style="margin: 0 44pt 28pt 44pt; display: flex; justify-content: flex-end; align-items: center; padding-top: 12pt; border-top: 1pt solid #222;">
    <div style="font-size: 11pt; color: #fff; font-weight: 600;">사람이 시키지 않아도 돌아가는 개발</div>
  </div>

</body>
</html>
