<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>
</head>
<body style="width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Label -->
  <div style="margin: 36pt 0 0 44pt;">
    <span style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 2pt; text-transform: uppercase;">How It Works</span>
  </div>

  <div style="margin: 8pt 44pt 0 44pt; font-size: 24pt; font-weight: 700; color: #111; line-height: 1.3;">단순히 물어보고 생성하는 게 아닙니다</div>

  <!-- 4-step process -->
  <div style="flex: 1; margin: 20pt 44pt 36pt 44pt; display: flex; gap: 12pt;">

    <!-- Step 1 -->
    <div style="flex: 1; background: #111; border-radius: 10pt; padding: 18pt; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div style="font-size: 9pt; font-weight: 600; color: #555; letter-spacing: 1pt;">STEP 1</div>
        <div style="font-size: 14pt; font-weight: 700; color: #fff; margin-top: 8pt; line-height: 1.3;">전략 수립</div>
      </div>
      <div style="font-size: 10pt; color: #888; line-height: 1.6; margin-top: 12pt;">유저 태스크를 위한<br>최적의 전략 수립<br><span style="color: #666;">best practice 조사</span></div>
    </div>

    <!-- Step 2 -->
    <div style="flex: 1; background: #111; border-radius: 10pt; padding: 18pt; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div style="font-size: 9pt; font-weight: 600; color: #555; letter-spacing: 1pt;">STEP 2</div>
        <div style="font-size: 14pt; font-weight: 700; color: #fff; margin-top: 8pt; line-height: 1.3;">변수 설정</div>
      </div>
      <div style="font-size: 10pt; color: #888; line-height: 1.6; margin-top: 12pt;">유저의 context를 고려해<br>optimal 결과물을 위한<br><span style="color: #666;">여러 변수들 지정</span></div>
    </div>

    <!-- Step 3 -->
    <div style="flex: 1; background: #111; border-radius: 10pt; padding: 18pt; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div style="font-size: 9pt; font-weight: 600; color: #555; letter-spacing: 1pt;">STEP 3</div>
        <div style="font-size: 14pt; font-weight: 700; color: #fff; margin-top: 8pt; line-height: 1.3;">시뮬레이션</div>
      </div>
      <div style="font-size: 10pt; color: #888; line-height: 1.6; margin-top: 12pt;">변수를 바꿔가며<br>5개 후보를<br><span style="color: #666;">병렬 시뮬레이션</span></div>
    </div>

    <!-- Step 4 -->
    <div style="flex: 1; background: #fafafa; border-radius: 10pt; padding: 18pt; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div style="font-size: 9pt; font-weight: 600; color: #bbb; letter-spacing: 1pt;">STEP 4</div>
        <div style="font-size: 14pt; font-weight: 700; color: #111; margin-top: 8pt; line-height: 1.3;">리뷰 &amp; 선택</div>
      </div>
      <div style="font-size: 10pt; color: #888; line-height: 1.6; margin-top: 12pt;">AI가 평가 기준을 만들어<br>리뷰 후 가장 좋은<br><span style="font-weight: 600; color: #111;">1개만 return</span></div>
    </div>

  </div>

</body>
</html>
