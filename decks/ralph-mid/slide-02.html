<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>
</head>
<body style="width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Label -->
  <div style="margin: 40pt 0 0 44pt;">
    <span style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 2pt; text-transform: uppercase;">PROBLEM</span>
  </div>

  <!-- Title -->
  <div style="margin: 12pt 44pt 0 44pt; font-size: 28pt; font-weight: 700; color: #111; line-height: 1.3;">AI 앞에서 머리가 하얘지는 사람들</div>

  <!-- Two column layout -->
  <div style="display: flex; flex: 1; margin: 24pt 44pt 40pt 44pt; gap: 32pt;">

    <!-- Left column: Quote flow -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
      <div style="border-left: 2pt solid #ddd; padding: 16pt 20pt;">
        <div style="font-size: 13pt; color: #111; line-height: 2; font-weight: 400;">
          <span style="font-weight: 600;">"자기소개서 써줘"</span><br>
          <span style="color: #ccc; font-size: 14pt;">&darr;</span><br>
          쓸 수 없는 결과물<br>
          <span style="color: #ccc; font-size: 14pt;">&darr;</span><br>
          다시 시도<br>
          <span style="color: #ccc; font-size: 14pt;">&darr;</span><br>
          <span style="font-weight: 600;">무한 반복</span>
        </div>
      </div>
    </div>

    <!-- Right column: Problem bullets -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14pt;">
      <div style="padding: 12pt 16pt; border-bottom: 1pt solid #eee;">
        <div style="font-size: 13pt; color: #111; line-height: 1.6; font-weight: 400;">적절한 <span style="font-weight: 700;">컨텍스트</span>를 넣어주는 법을 모름</div>
        <div style="font-size: 11pt; color: #999; margin-top: 4pt;">경력, 강점, 지원 직무...</div>
      </div>
      <div style="padding: 12pt 16pt; border-bottom: 1pt solid #eee;">
        <div style="font-size: 13pt; color: #111; line-height: 1.6; font-weight: 400;">최적의 <span style="font-weight: 700;">워크플로우</span>를 모름</div>
        <div style="font-size: 11pt; color: #999; margin-top: 4pt;">어떤 순서로 무엇을 해야 하는지</div>
      </div>
      <div style="padding: 12pt 16pt;">
        <div style="font-size: 13pt; color: #111; line-height: 1.6; font-weight: 400;">문서를 쓸 때 <span style="font-weight: 700;">매번</span> 발생하는 문제</div>
        <div style="font-size: 11pt; color: #999; margin-top: 4pt;">자기소개서, 사업계획서, 여행계획...</div>
      </div>
    </div>

  </div>

</body>
</html>
