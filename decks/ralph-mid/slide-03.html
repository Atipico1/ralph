<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>
</head>
<body style="width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Label -->
  <div style="margin: 36pt 0 0 44pt;">
    <span style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 2pt; text-transform: uppercase;">STORY</span>
  </div>

  <!-- Title -->
  <div style="margin: 12pt 44pt 0 44pt; font-size: 28pt; font-weight: 700; color: #111; line-height: 1.3;">여자친구의 자기소개서</div>

  <!-- 2x2 card grid -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; margin: 20pt 44pt 0 44pt; flex: 1;">

    <!-- Card 1 -->
    <div style="background: #fafafa; border-radius: 10pt; padding: 16pt 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 9pt; font-weight: 600; color: #bbb; letter-spacing: 1pt; margin-bottom: 6pt;">01</div>
      <div style="font-size: 12pt; color: #111; line-height: 1.7; font-weight: 400;">여자친구가 취업 준비 중<br>자기소개서를 써야 하는 상황</div>
    </div>

    <!-- Card 2 -->
    <div style="background: #fafafa; border-radius: 10pt; padding: 16pt 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 9pt; font-weight: 600; color: #bbb; letter-spacing: 1pt; margin-bottom: 6pt;">02</div>
      <div style="font-size: 12pt; color: #111; line-height: 1.7; font-weight: 400;">ChatGPT에 <span style="font-weight: 600;">"자기소개서 써줘"</span>만<br>반복해서 입력</div>
    </div>

    <!-- Card 3 -->
    <div style="background: #fafafa; border-radius: 10pt; padding: 16pt 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 9pt; font-weight: 600; color: #bbb; letter-spacing: 1pt; margin-bottom: 6pt;">03</div>
      <div style="font-size: 12pt; color: #111; line-height: 1.7; font-weight: 400;">경력, 강점, 지원 직무 같은<br><span style="font-weight: 600;">컨텍스트를 넣어야 하는데</span> 방법을 모름</div>
    </div>

    <!-- Card 4 -->
    <div style="background: #fafafa; border-radius: 10pt; padding: 16pt 18pt; display: flex; flex-direction: column; justify-content: center;">
      <div style="font-size: 9pt; font-weight: 600; color: #bbb; letter-spacing: 1pt; margin-bottom: 6pt;">04</div>
      <div style="font-size: 12pt; color: #111; line-height: 1.7; font-weight: 400;">뻔하고 쓸 수 없는<br>결과물만 반복</div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div style="margin: 12pt 44pt 32pt 44pt; background: #111; border-radius: 8pt; padding: 14pt 20pt; display: flex; align-items: center; gap: 14pt;">
    <div style="font-size: 11pt; color: #ffffff; font-weight: 700;">문제의 본질</div>
    <div style="width: 1pt; height: 14pt; background: #444;"></div>
    <div style="font-size: 12pt; color: #ccc; font-weight: 400;">최적의 워크플로우를 모른다</div>
  </div>

</body>
</html>
