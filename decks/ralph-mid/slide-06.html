<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>
</head>
<body style="width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Label -->
  <div style="margin: 32pt 0 0 44pt;">
    <span style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 2pt; text-transform: uppercase;">WORKFLOW</span>
  </div>

  <!-- Title -->
  <div style="margin: 10pt 44pt 0 44pt; font-size: 24pt; font-weight: 700; color: #111; line-height: 1.3;">
    Collect <span style="color: #ccc;">&rarr;</span> Simulate <span style="color: #ccc;">&rarr;</span> Deliver
  </div>

  <!-- Three columns -->
  <div style="display: flex; flex: 1; margin: 16pt 44pt 32pt 44pt; gap: 14pt;">

    <!-- Column 1: Collect -->
    <div style="flex: 1; display: flex; flex-direction: column; background: #fafafa; border-radius: 10pt; padding: 12pt; overflow: hidden;">
      <img src="./assets/02-collect.png" alt="Collect Phase" style="width: 100%; border-radius: 6pt; margin-bottom: 10pt;">
      <div style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 1pt; margin-bottom: 4pt;">COLLECT</div>
      <div style="font-size: 11pt; color: #111; line-height: 1.7; font-weight: 400;">에이전트가 질문하고<br>유저는 답만 합니다</div>
    </div>

    <!-- Column 2: Simulate -->
    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <div style="width: 100%; flex: 1; background: #111; border-radius: 10pt; padding: 12pt; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6pt; margin-bottom: 10pt;">
        <div style="display: flex; gap: 4pt;">
          <div style="width: 22pt; height: 36pt; background: #333; border-radius: 4pt;"></div>
          <div style="width: 22pt; height: 36pt; background: #444; border-radius: 4pt;"></div>
          <div style="width: 22pt; height: 36pt; background: #555; border-radius: 4pt;"></div>
          <div style="width: 22pt; height: 36pt; background: #666; border-radius: 4pt;"></div>
          <div style="width: 22pt; height: 36pt; background: #888; border-radius: 4pt;"></div>
        </div>
        <div style="font-size: 8pt; color: #888; font-weight: 500; margin-top: 2pt;">5 candidates &rarr; AI 평가</div>
      </div>
      <div style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 1pt; margin-bottom: 4pt;">SIMULATE</div>
      <div style="font-size: 11pt; color: #111; line-height: 1.7; font-weight: 400;">5개 후보 병렬 생성<br><span style="color: #999;">Cerebras ~1초</span></div>
    </div>

    <!-- Column 3: Deliver -->
    <div style="flex: 1; display: flex; flex-direction: column; background: #fafafa; border-radius: 10pt; padding: 12pt; overflow: hidden;">
      <img src="./assets/05-deliver.png" alt="Deliver Phase" style="width: 100%; border-radius: 6pt; margin-bottom: 10pt;">
      <div style="font-size: 9pt; font-weight: 600; color: #999; letter-spacing: 1pt; margin-bottom: 4pt;">DELIVER</div>
      <div style="font-size: 11pt; color: #111; line-height: 1.7; font-weight: 400;">최선의 결과물 + 근거<br>수정 요청 가능</div>
    </div>

  </div>

</body>
</html>
